name: Build and release BsCode

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: bscode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            architecture: arm64
            artifact: BsCode-macOS-arm64
            archive: dist/BsCode-macOS-arm64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          actual_architecture="$(node -p 'process.arch')"
          if [[ "$actual_architecture" != "$EXPECTED_ARCHITECTURE" ]]; then
            echo "Expected $EXPECTED_ARCHITECTURE, got $actual_architecture." >&2
            exit 1
          fi

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version v$package_version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check source and packaging configuration
        run: npm run check

      - name: Build native application
        run: npm run package:current

      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/mac/BsCode.app \
            dist/BsCode-macOS-arm64.zip

      - name: Upload ${{ matrix.label }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download native builds
        uses: actions/download-artifact@v4
        with:
          pattern: BsCode-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: release
        run: sha256sum BsCode-* > SHA256SUMS.txt

      - name: Create release or update its assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | sort)
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber \
              --repo "$REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --generate-notes \
              --title "BsCode $RELEASE_TAG" \
              --repo "$REPOSITORY"
          fi
