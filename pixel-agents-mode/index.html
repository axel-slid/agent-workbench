<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Agents</title>
    <script>
      window.__AGENT_WORKBENCH_PIXEL_MODE = true;
      window.acquireVsCodeApi = function () {
        return {
          postMessage: function (message) {
            window.parent.postMessage({ source: "agent-workbench-pixel-mode", message: message }, "*");
          },
          getState: function () { return undefined; },
          setState: function () {}
        };
      };
      function useSymbolButtons() {
        const symbols = {
          "+ Agent": ["+", "New agent"],
          "Layout": ["▦", "Edit office layout"],
          "Settings": ["⚙", "Settings"]
        };
        document.querySelectorAll("button").forEach(function (button) {
          const match = symbols[button.textContent.trim()];
          if (!match) return;
          button.textContent = match[0];
          button.title = match[1];
          button.setAttribute("aria-label", match[1]);
        });
      }
      new MutationObserver(useSymbolButtons).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
      window.addEventListener("DOMContentLoaded", useSymbolButtons);

      function floorPreviewBounds(context, source) {
        const pixels = context.getImageData(0, 0, source.width, source.height).data;
        const step = Math.max(2, Math.floor(Math.min(source.width, source.height) / 280));
        const rowScores = new Uint16Array(Math.ceil(source.height / step));
        const columnScores = new Uint16Array(Math.ceil(source.width / step));
        const sample = function (x, y) {
          const offset = (y * source.width + x) * 4;
          const red = pixels[offset];
          const green = pixels[offset + 1];
          const blue = pixels[offset + 2];
          const alpha = pixels[offset + 3];
          const light = red + green + blue;
          const chroma = Math.max(red, green, blue) - Math.min(red, green, blue);
          return alpha > 32 && (light > 150 || chroma > 34);
        };
        for (let y = 0, row = 0; y < source.height; y += step, row += 1) {
          for (let x = 0, column = 0; x < source.width; x += step, column += 1) {
            if (!sample(x, y)) continue;
            rowScores[row] += 1;
            columnScores[column] += 1;
          }
        }
        const rowThreshold = Math.max(4, Math.floor(columnScores.length * 0.08));
        const columnThreshold = Math.max(4, Math.floor(rowScores.length * 0.08));
        const qualifyingRows = Array.from(rowScores, function (score, index) {
          return score >= rowThreshold ? index : -1;
        }).filter(function (index) { return index >= 0; });
        const qualifyingColumns = Array.from(columnScores, function (score, index) {
          return score >= columnThreshold ? index : -1;
        }).filter(function (index) { return index >= 0; });
        if (!qualifyingRows.length || !qualifyingColumns.length) {
          return { x: 0, y: 0, width: source.width, height: source.height };
        }
        const padding = 12;
        const left = Math.max(0, qualifyingColumns[0] * step - padding);
        const right = Math.min(
          source.width,
          (qualifyingColumns[qualifyingColumns.length - 1] + 1) * step + padding
        );
        const top = Math.max(0, qualifyingRows[0] * step - padding);
        const bottom = Math.min(
          source.height,
          (qualifyingRows[qualifyingRows.length - 1] + 1) * step + padding
        );
        const width = right - left;
        const height = bottom - top;
        if (width < source.width * 0.2 || height < source.height * 0.2) {
          return { x: 0, y: 0, width: source.width, height: source.height };
        }
        return { x: left, y: top, width: width, height: height };
      }

      function captureFloorPreview(floor) {
        window.setTimeout(function () {
          try {
            const canvases = Array.from(document.querySelectorAll("canvas"))
              .filter(function (canvas) { return canvas.width > 0 && canvas.height > 0; })
              .sort(function (left, right) {
                return right.width * right.height - left.width * left.height;
              });
            const source = canvases[0];
            if (!source) return;
            const preview = document.createElement("canvas");
            preview.width = 192;
            preview.height = 112;
            const context = preview.getContext("2d");
            if (!context) return;
            context.imageSmoothingEnabled = false;
            context.fillStyle = "#111820";
            context.fillRect(0, 0, preview.width, preview.height);
            const sourceContext = source.getContext("2d", { willReadFrequently: true });
            const bounds = sourceContext
              ? floorPreviewBounds(sourceContext, source)
              : { x: 0, y: 0, width: source.width, height: source.height };
            const scale = Math.max(preview.width / bounds.width, preview.height / bounds.height);
            const width = Math.max(1, Math.round(bounds.width * scale));
            const height = Math.max(1, Math.round(bounds.height * scale));
            context.drawImage(
              source,
              bounds.x,
              bounds.y,
              bounds.width,
              bounds.height,
              Math.round((preview.width - width) / 2),
              Math.round((preview.height - height) / 2),
              width,
              height
            );
            window.parent.postMessage({
              source: "agent-workbench-pixel-mode",
              message: {
                type: "floorPreview",
                floor: Number(floor) || 1,
                image: preview.toDataURL("image/webp", 0.82)
              }
            }, "*");
          } catch (error) {
          }
        }, 8);
      }

      // Expose the same capture path to the BsCode bridge so automatic and
      // manual refreshes always use the canvas that is actually on screen.
      window.captureFloorPreview = captureFloorPreview;

      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "captureFloorPreview") {
          captureFloorPreview(event.data.floor);
        }
      });

      // Pixel Agents natively uses middle-drag for panning and modifier+wheel
      // for zooming. Agent Workbench exposes the more direct controls requested
      // by the desktop app: left-drag to pan and a plain wheel to zoom.
      (function installWorkbenchNavigation() {
        let panCandidate = null;
        let panActive = false;
        let forwardingMouse = false;
        let forwardingWheel = false;
        let suppressNextClick = false;

        function canvasTarget(target) {
          return target && target.tagName === "CANVAS" ? target : null;
        }

        document.addEventListener("mousedown", function (event) {
          if (forwardingMouse || event.button !== 0) return;
          const canvas = canvasTarget(event.target);
          if (!canvas) return;
          panCandidate = {
            canvas,
            startX: event.clientX,
            startY: event.clientY
          };
          panActive = false;
        }, true);

        document.addEventListener("mousemove", function (event) {
          if (forwardingMouse || !panCandidate) return;
          const distance = Math.hypot(
            event.clientX - panCandidate.startX,
            event.clientY - panCandidate.startY
          );
          if (!panActive && distance > 4) {
            panActive = true;
            forwardingMouse = true;
            panCandidate.canvas.dispatchEvent(new MouseEvent("mousedown", {
              bubbles: true,
              cancelable: true,
              button: 1,
              buttons: 4,
              clientX: panCandidate.startX,
              clientY: panCandidate.startY
            }));
            forwardingMouse = false;
          }
          if (!panActive) return;
          forwardingMouse = true;
          panCandidate.canvas.dispatchEvent(new MouseEvent("mousemove", {
            bubbles: true,
            cancelable: true,
            button: 1,
            buttons: 4,
            clientX: event.clientX,
            clientY: event.clientY
          }));
          forwardingMouse = false;
        }, true);

        document.addEventListener("mouseup", function (event) {
          if (forwardingMouse || event.button !== 0 || !panCandidate) return;
          if (panActive) {
            forwardingMouse = true;
            panCandidate.canvas.dispatchEvent(new MouseEvent("mouseup", {
              bubbles: true,
              cancelable: true,
              button: 1,
              buttons: 0,
              clientX: event.clientX,
              clientY: event.clientY
            }));
            forwardingMouse = false;
            suppressNextClick = true;
          }
          panCandidate = null;
          panActive = false;
        }, true);

        document.addEventListener("click", function (event) {
          if (!suppressNextClick || !canvasTarget(event.target)) return;
          suppressNextClick = false;
          event.preventDefault();
          event.stopImmediatePropagation();
        }, true);

        document.addEventListener("wheel", function (event) {
          if (forwardingWheel || event.ctrlKey || event.metaKey) return;
          const canvas = canvasTarget(event.target);
          if (!canvas) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          forwardingWheel = true;
          canvas.dispatchEvent(new WheelEvent("wheel", {
            bubbles: true,
            cancelable: true,
            ctrlKey: true,
            deltaMode: event.deltaMode,
            deltaX: event.deltaX,
            deltaY: event.deltaY,
            clientX: event.clientX,
            clientY: event.clientY
          }));
          forwardingWheel = false;
        }, { capture: true, passive: false });
      })();
    </script>
